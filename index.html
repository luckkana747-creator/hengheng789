<style id="hide-netlify-final">
/* ซ่อนป้าย Powered by Netlify ทุกรูปแบบ */
a[href*="netlify"], div:has(> a[href*="netlify"]), div[style*="Powered by Netlify"],
div[class*="netlify"], iframe[src*="netlify"]{display:none !important; opacity:0 !important; pointer-events:none !important; visibility:hidden !important; }
</style>
<script>
(function(){
  function kill(){
    document.querySelectorAll('*').forEach(el=>{
      if(el.textContent && el.textContent.trim()==='Powered by Netlify'){let p=el; for(let i=0;i<5&&p;i++){if(p.tagName==='A' || (p.textContent && p.textContent.includes('Powered by Netlify') && p.offsetWidth<300 && p.offsetHeight<60)){p.style.display='none'; p.remove(); break;} p=p.parentElement;}}
      if(el.innerText && el.innerText.includes('Powered by Netlify') && el.children.length<=2){el.style.display='none';}
    });
    // ซ่อนปุ่มดำๆ มุมขวาล่างโดยตรง
    document.querySelectorAll('div, a, span').forEach(el=>{
      const s=getComputedStyle(el);
      if(s.position==='fixed' && (s.bottom==='0px' || parseInt(s.bottom)<100) && (s.right==='0px' || parseInt(s.right)<100)){
        if(el.textContent && el.textContent.toLowerCase().includes('netlify')){el.style.display='none'; el.remove();}
      }
    });
  }
  setInterval(kill, 500);
  new MutationObserver(kill).observe(document.body,{childList:true, subtree:true});
  window.addEventListener('load', kill);
})();
<\/script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap');
  #lock-screen-limepinkpurple{position:fixed;inset:0;z-index:9999999;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:14px;overflow:auto;background:linear-gradient(135deg,#FBCFE8 0%,#F9A8D4 18%,#DDD6FE 55%,#C4B5FD 100%);min-height:100vh;}
  #lock-screen-limepinkpurple *{box-sizing:border-box;font-family:'Kanit',sans-serif;}
  .lpp-wrap{width:100%;max-width:430px;background:#fff;border-radius:36px;padding:28px 24px 24px;box-shadow:0 24px 60px rgba(0,0,0,0.12);margin-top:6px;}
  .lpp-kitty{width:190px;height:190px;border-radius:50%;display:block;margin:2px auto 0;object-fit:cover;}
  .lpp-welcome{margin:18px 0 0;text-align:center;font-size:30px;font-weight:800;line-height:1.2;background:linear-gradient(90deg,#EC4899 0%,#A855F7 55%,#6366F1 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .lpp-welcome-sub{margin:10px 0 0;text-align:center;font-size:16px;color:#64748B;line-height:1.5;}
  .lpp-spark{text-align:center;font-size:18px;margin:6px 0 0;}
  .lpp-label{margin:26px 0 10px;font-size:17px;font-weight:700;color:#1E293B;}
  .lpp-field{display:flex;align-items:center;gap:12px;background:#FFF5F8;border:1.5px solid #FCE7F3;border-radius:26px;padding:0 18px;height:64px;}
  .lpp-field:focus-within{border-color:#F9A8D4;box-shadow:0 0 0 4px rgba(249,168,212,0.25);}
  .lpp-field .lpp-ico{font-size:20px;color:#EC4899;flex-shrink:0;}
  .lpp-input{border:none;outline:none;background:transparent;flex:1;font-size:16px;color:#1E293B;min-width:0;}
  .lpp-input::placeholder{color:#94A3B8;}
  .lpp-eye{border:none;background:transparent;font-size:20px;color:#94A3B8;cursor:pointer;flex-shrink:0;padding:4px;}
  .lpp-row{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 0;}
  .lpp-remember{display:flex;align-items:center;gap:10px;font-size:15px;color:#334155;cursor:pointer;}
  .lpp-remember input{width:24px;height:24px;accent-color:#EC4899;}
  .lpp-forgot2{font-size:15px;color:#EC4899;font-weight:600;text-decoration:none;}
  .lpp-btn{width:100%;height:62px;border:none;border-radius:26px;background:linear-gradient(90deg,#F472B6 0%,#C084FC 50%,#818CF8 100%);color:#fff;font-size:19px;font-weight:700;cursor:pointer;box-shadow:0 12px 28px rgba(236,72,153,0.30);display:flex;align-items:center;justify-content:center;gap:10px;margin-top:26px;}
  .lpp-error{display:none;margin-top:14px;background:#FFF0F5;border:1px solid #FFD0E0;color:#FF3B7A;border-radius:12px;padding:10px;text-align:center;font-size:14px;}
  .lpp-or{display:flex;align-items:center;gap:12px;margin-top:24px;color:#94A3B8;font-size:15px;}
  .lpp-or:before,.lpp-or:after{content:"";flex:1;height:1px;background:#F1F5F9;}
</style>

<script>
(function(){
  const U="Goodlucky", P="9999", KEY="hengdee_limepinkpurple_fixed";
  const lock=document.getElementById("lock-screen-limepinkpurple");
  const root=document.getElementById("root");
  const iu=document.getElementById("lpp-user"), ip=document.getElementById("lpp-pass"), btn=document.getElementById("lpp-login"), err=document.getElementById("lpp-err");
  const showApp=()=>{lock.style.display="none"; if(root) root.style.display=""; document.body.style.overflow="";};
  const showLock=()=>{if(root) root.style.display="none"; lock.style.display="flex";};
  const login=()=>{if(iu.value.trim()===U && ip.value.trim()===P){localStorage.setItem(KEY,"1"); showApp();}else{err.style.display="block"; ip.value="";}};
  if(localStorage.getItem(KEY)==="1") showApp(); else showLock();
  btn.addEventListener("click", login);
  iu.addEventListener("keydown", e=>{ if(e.key==="Enter") ip.focus(); });
  ip.addEventListener("keydown", e=>{ if(e.key==="Enter") login(); });
  // ซ่อนป้าย Netlify ที่อาจถูก inject มาทีหลัง
  setInterval(()=>{document.querySelectorAll('a,div,span').forEach(el=>{if(el.textContent && el.textContent.includes('Powered by Netlify')){el.style.display='none';}});}, 1000);
})();

<script>
(function(){
  function createChonBox(){
    // Remove old if exists
    let old = document.getElementById('chon-box-external');
    if(old) old.remove();
    
    // Find pinned container: element containing "รายการปักหมุด"
    let pinnedHeader = null;
    let all = document.querySelectorAll('div, h3, span');
    for(let el of all){
      if(el.textContent && el.textContent.includes('รายการปักหมุด')){
        // Find the card container
        let card = el.closest('div.bg-white');
        if(card){
          pinnedHeader = card;
          break;
        }
      }
    }
    if(!pinnedHeader) return;
    
    // Compute most frequent digits from visible formula cards (สูตรคงที่)
    // Look for elements with id starting with pin- or containing combo
    let freq = {};
    for(let i=0;i<10;i++) freq[i]=0;
    let cards = document.querySelectorAll('[id^="pin-"]');
    if(cards.length===0){
      // fallback: look for divs that contain big digits
      cards = document.querySelectorAll('div.bg-white.rounded-\\[20px\\]');
    }
    let hasData = false;
    cards.forEach(card=>{
      let txt = card.textContent||"";
      // Try to find combo like 0123456789 inside card's big number
      // The big number is in element with style color #2B6CB0 or font size 32px
      let big = card.querySelector('div[style*="32px"], span[style*="32px"]');
      let digits = "";
      if(card.id && card.id.startsWith('pin-')){
        digits = card.id.replace('pin-','');
      } else if(big){
        digits = big.textContent.replace(/\\s/g,'');
      }
      if(digits && /^[0-9]{4,10}$/.test(digits)){
        let seen={};
        for(let ch of digits){
          if(!seen[ch]){ freq[ch]=(freq[ch]||0)+1; seen[ch]=1; hasData=true; }
        }
      }
    });
    
    // If still no data, try to get from all visible cards text
    if(!hasData){
      // Show default from image
      freq = {'0':5,'4':5,'9':4,'3':4,'1':4,'5':3,'2':3,'6':3};
    }
    
    let arr = Object.keys(freq).map(k=>({d:k,c:freq[k]})).filter(x=>x.c>0).sort((a,b)=>b.c-a.c);
    // Read selected count from filter - must match exactly e.g. "1 ตัว"
    let selectedCount = 6;
    try{
      let filterCards = document.querySelectorAll('div.bg-white');
      for(let card of filterCards){
        let txtCard = (card.textContent||'');
        // Filter card has both "รอบ" and "ตัว"
        if(txtCard.includes('รอบ') && txtCard.includes('ตัว')){
          let btns = card.querySelectorAll('button');
          for(let b of btns){
            let t = (b.textContent||'').trim();
            let m = t.match(/^(\\d+)\\s*ตัว$/);
            if(m){
              selectedCount = parseInt(m[1],10);
              break;
            }
          }
          if(selectedCount!==6) break;
          // fallback scan any element inside card
          let allInside = card.querySelectorAll('*');
          for(let el of allInside){
            if(el.children.length===0){
              let t = (el.textContent||'').trim();
              let m = t.match(/^(\\d+)\\s*ตัว$/);
              if(m){
                selectedCount = parseInt(m[1],10);
                break;
              }
            }
          }
          if(selectedCount!==6) break;
        }
      }
    }catch(e){}
    if(arr.length>selectedCount) arr = arr.slice(0,selectedCount);
    
    let box = document.createElement('div');
    box.id='chon-box-external';
    box.className='bg-white rounded-[20px] border border-[#E9E2FF] shadow-[0_8px_24px_rgba(124,58,237,0.06)] p-5 mt-3';
    box.innerHTML = \`
      <div style="text-align:center;font-size:15px;font-weight:bold;color:#7C3AED;letter-spacing:0.5px;">-- เลขชนกันมากที่สุด --</div>
      <div style="margin-top:12px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;">
        \${arr.map(x=>\`<span style="font-size:32px;font-weight:900;color:#44CE02;line-height:1;letter-spacing:2px;">\${x.d}</span>\`).join('')}
      </div>
    \`;
    
    // Insert after pinned container
    pinnedHeader.parentNode.insertBefore(box, pinnedHeader.nextSibling);
  }
  
  // Run after load and on tab changes
  setTimeout(createChonBox, 800);
  setTimeout(createChonBox, 2000);
  // Watch for DOM changes (when filter changes, new cards loaded)
  let observer = new MutationObserver(()=>{ setTimeout(createChonBox, 300); });
  observer.observe(document.body, {childList:true, subtree:true});
  
  // Also run on click of filter buttons
  document.addEventListener('click', ()=>{ setTimeout(createChonBox, 500); });
})();
<\/script>
<script>
(function(){
  function moveLa(){
    document.querySelectorAll('.la-box').forEach(function(el){
      if(!el.textContent || !el.textContent.trim()){ el.style.display='none'; return; }
      el.style.display='';
      var card = el.closest('div[id^="formula-card-"], div[id^="pin-"], div[id^="fixed-"], div[id^="special-"]');
      if(!card) card = el.closest('div.bg-white');
      if(card && card.lastChild!==el){ card.appendChild(el); }
    });
  }
  setTimeout(moveLa, 500);
  setTimeout(moveLa, 1500);
  var ob=new MutationObserver(function(){ setTimeout(moveLa, 200); });
  ob.observe(document.body, {childList:true, subtree:true});
  document.addEventListener('click', function(){ setTimeout(moveLa, 400); });
})();
